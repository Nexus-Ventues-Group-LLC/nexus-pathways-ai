name: GitHub workflow validation

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: false

      - name: Require immutable action pins
        shell: bash
        run: |
          invalid_references="$(
            grep -PRn \
              '^\s*uses:\s+[^./][^@]*@(?![0-9a-f]{40}\s+#\s+\S+)' \
              .github/workflows || true
          )"
          if [[ -n "$invalid_references" ]]; then
            echo "External actions must use a full commit SHA and version comment:"
            echo "$invalid_references"
            exit 1
          fi

      - name: Preserve the merge queue isolation gate
        shell: bash
        run: |
          workflow=".github/workflows/api-integration-isolation.yml"
          grep -Fq "  merge_group:" "$workflow"
          grep -Fq "    name: Database fixture isolation" "$workflow"

      - name: Validate all workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
