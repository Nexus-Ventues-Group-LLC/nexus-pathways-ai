openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nexus Pathways AI Phase 1 foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Authenticated identity and portal context
  - name: administration
    description: Scoped organization administration
  - name: audit
    description: Security audit events
  - name: learner
    description: Learner-owned learning experience
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated user's portal context
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user and scoped organization context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [identity]
      summary: Get the authenticated user's Phase 1 dashboard summary
      security:
        - clerkSession: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get scoped administrator overview
      security:
        - clerkSession: []
      responses:
        "200":
          description: Scoped organization hierarchy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/hierarchy:
    get:
      operationId: getAdminHierarchy
      tags: [administration]
      summary: Get the organization hierarchy visible to the administrator
      security:
        - clerkSession: []
      responses:
        "200":
          description: Scoped hierarchy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationHierarchy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/facilities:
    post:
      operationId: createFacility
      tags: [administration]
      summary: Create a facility beneath an authorized region
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Created facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/facilities/{facilityId}:
    patch:
      operationId: updateFacility
      tags: [administration]
      summary: Update a visible facility
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/FacilityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityUpdate"
      responses:
        "200":
          description: Updated facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/programs:
    post:
      operationId: createProgram
      tags: [administration]
      summary: Create a program beneath an authorized facility
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/programs/{programId}:
    patch:
      operationId: updateProgram
      tags: [administration]
      summary: Update a visible program
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/tenant-configuration:
    get:
      operationId: getTenantConfiguration
      tags: [administration]
      summary: Get authorized tenant module and policy configuration
      security:
        - clerkSession: []
      responses:
        "200":
          description: Tenant configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfiguration"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateTenantConfiguration
      tags: [administration]
      summary: Update authorized tenant module and policy configuration
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantConfigurationUpdate"
      responses:
        "200":
          description: Updated tenant configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List security events visible to an authorized administrator
      security:
        - clerkSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /learner/home:
    get:
      operationId: getLearnerHome
      tags: [learner]
      summary: Get the authenticated learner's assigned learning experience
      security:
        - clerkSession: []
      responses:
        "200":
          description: Learner home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerHome"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learner/coursework/{courseworkId}/complete:
    post:
      operationId: completeLearnerCoursework
      tags: [learner]
      summary: Complete an assigned demo coursework item
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/CourseworkId"
      responses:
        "200":
          description: Completed coursework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerCoursework"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /learner/goals:
    patch:
      operationId: updateLearnerGoals
      tags: [learner]
      summary: Update the authenticated learner's learning goals
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnerGoalsUpdate" }
      responses:
        "200":
          description: Learning goals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerGoals" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learner/presentation-preferences:
    patch:
      operationId: updateLearnerPresentationPreferences
      tags: [learner]
      summary: Update allowed learner presentation preferences
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresentationPreferencesUpdate" }
      responses:
        "200":
          description: Presentation preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learner/activity:
    post:
      operationId: recordLearnerActivity
      tags: [learner]
      summary: Record learner activity and return inactivity policy
      security:
        - clerkSession: []
      responses:
        "200":
          description: Learner session policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerActivity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session cookie in browser or bearer token for API clients
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not authorized for this scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found in the authorized scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    FacilityId:
      name: facilityId
      in: path
      required: true
      schema: { type: string }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string }
    CourseworkId:
      name: courseworkId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScopeRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: "#/components/schemas/ScopeContext"
      required: [id, displayName, email, role, permissions, scope]
    ScopeContext:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/ScopeRef"
        agency:
          anyOf: [{ $ref: "#/components/schemas/ScopeRef" }, { type: "null" }]
        region:
          anyOf: [{ $ref: "#/components/schemas/ScopeRef" }, { type: "null" }]
        facility:
          anyOf: [{ $ref: "#/components/schemas/ScopeRef" }, { type: "null" }]
        program:
          anyOf: [{ $ref: "#/components/schemas/ScopeRef" }, { type: "null" }]
        cohort:
          anyOf: [{ $ref: "#/components/schemas/ScopeRef" }, { type: "null" }]
        level:
          type: string
          enum: [organization, agency, region, facility, program, cohort]
      required: [organization, agency, region, facility, program, cohort, level]
    Dashboard:
      type: object
      properties:
        portal:
          type: string
          enum: [learner, educator, administrator]
        headline:
          type: string
        scope:
          $ref: "#/components/schemas/ScopeContext"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        capabilities:
          type: array
          items:
            type: string
      required: [portal, headline, scope, metrics, capabilities]
    Metric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
      required: [label, value, detail]
    AdminOverview:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/ScopeRef"
        agencies:
          type: number
        regions:
          type: number
        facilities:
          type: number
        programs:
          type: number
        cohorts:
          type: number
        learners:
          type: number
        educators:
          type: number
        syntheticDataNotice:
          type: string
      required:
        [organization, agencies, regions, facilities, programs, cohorts, learners, educators, syntheticDataNotice]
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        category:
          type: string
        actorDisplayName:
          type: string
        resourceType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        outcome:
          type: string
      required: [id, action, category, actorDisplayName, resourceType, createdAt, outcome]
    Facility:
      type: object
      properties:
        id: { type: string }
        regionId: { type: string }
        name: { type: string }
      required: [id, regionId, name]
    FacilityInput:
      type: object
      properties:
        regionId: { type: string }
        name: { type: string, minLength: 1 }
      required: [regionId, name]
    FacilityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
      required: [name]
    Program:
      type: object
      properties:
        id: { type: string }
        facilityId: { type: string }
        name: { type: string }
      required: [id, facilityId, name]
    ProgramInput:
      type: object
      properties:
        facilityId: { type: string }
        name: { type: string, minLength: 1 }
      required: [facilityId, name]
    ProgramUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
      required: [name]
    HierarchyProgram:
      allOf:
        - $ref: "#/components/schemas/Program"
    HierarchyFacility:
      allOf:
        - $ref: "#/components/schemas/Facility"
      properties:
        programs:
          type: array
          items: { $ref: "#/components/schemas/HierarchyProgram" }
      required: [programs]
    HierarchyRegion:
      type: object
      properties:
        id: { type: string }
        agencyId: { type: string }
        name: { type: string }
        facilities:
          type: array
          items: { $ref: "#/components/schemas/HierarchyFacility" }
      required: [id, agencyId, name, facilities]
    HierarchyAgency:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        regions:
          type: array
          items: { $ref: "#/components/schemas/HierarchyRegion" }
      required: [id, organizationId, name, regions]
    OrganizationHierarchy:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/ScopeRef" }
        agencies:
          type: array
          items: { $ref: "#/components/schemas/HierarchyAgency" }
      required: [organization, agencies]
    TenantConfiguration:
      type: object
      properties:
        organizationId: { type: string }
        modules:
          type: object
          additionalProperties: false
          properties:
            abe: { type: boolean }
            hse: { type: boolean }
            specialEducation: { type: boolean }
            accessibility: { type: boolean }
            aiTutor: { type: boolean }
            career: { type: boolean }
            reentry: { type: boolean }
            passport: { type: boolean }
            offlineMode: { type: boolean }
          required: [abe, hse, specialEducation, accessibility, aiTutor, career, reentry, passport, offlineMode]
        policies:
          type: object
          additionalProperties: false
          properties:
            sessionTimeoutMinutes: { type: number, multipleOf: 1, minimum: 5, maximum: 480 }
            inactivityTimeoutMinutes: { type: number, multipleOf: 1, minimum: 5, maximum: 240 }
          required: [sessionTimeoutMinutes, inactivityTimeoutMinutes]
      required: [organizationId, modules, policies]
    TenantConfigurationUpdate:
      type: object
      properties:
        modules:
          type: object
          additionalProperties: false
          properties:
            abe: { type: boolean }
            hse: { type: boolean }
            specialEducation: { type: boolean }
            accessibility: { type: boolean }
            aiTutor: { type: boolean }
            career: { type: boolean }
            reentry: { type: boolean }
            passport: { type: boolean }
            offlineMode: { type: boolean }
          required: [abe, hse, specialEducation, accessibility, aiTutor, career, reentry, passport, offlineMode]
        policies:
          type: object
          additionalProperties: false
          properties:
            sessionTimeoutMinutes: { type: number, multipleOf: 1, minimum: 5, maximum: 480 }
            inactivityTimeoutMinutes: { type: number, multipleOf: 1, minimum: 5, maximum: 240 }
          required: [sessionTimeoutMinutes, inactivityTimeoutMinutes]
      required: [modules, policies]
    LearnerCoursework:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        instructionalHours: { type: number, minimum: 0 }
        status: { type: string, enum: [assigned, completed] }
        completedAt: { type: ["string", "null"], format: date-time }
      required: [id, title, description, instructionalHours, status, completedAt]
    LearnerResource:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        route: { type: string, pattern: "^/learner/resources/[a-z0-9-]+$" }
      required: [id, title, summary, content, route]
    LearnerGoals:
      type: object
      properties:
        goals:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 280 }
      required: [goals]
    LearnerGoalsUpdate:
      type: object
      additionalProperties: false
      properties:
        goals:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 280 }
      required: [goals]
    PresentationPreferences:
      type: object
      properties:
        textSize: { type: string, enum: [standard, large, extra-large] }
        highContrast: { type: boolean }
        reduceMotion: { type: boolean }
      required: [textSize, highContrast, reduceMotion]
    PresentationPreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        textSize: { type: string, enum: [standard, large, extra-large] }
        highContrast: { type: boolean }
        reduceMotion: { type: boolean }
      required: [textSize, highContrast, reduceMotion]
    LearnerActivity:
      type: object
      properties:
        lastActiveAt: { type: string, format: date-time }
        sessionTimeoutMinutes: { type: number }
        inactivityTimeoutMinutes: { type: number }
      required: [lastActiveAt, sessionTimeoutMinutes, inactivityTimeoutMinutes]
    LearnerHome:
      type: object
      properties:
        coursework:
          type: array
          items: { $ref: "#/components/schemas/LearnerCoursework" }
        goals: { $ref: "#/components/schemas/LearnerGoals" }
        presentationPreferences: { $ref: "#/components/schemas/PresentationPreferences" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/LearnerResource" }
        instructionalHoursCompleted: { type: number, minimum: 0 }
        activity: { $ref: "#/components/schemas/LearnerActivity" }
      required: [coursework, goals, presentationPreferences, resources, instructionalHoursCompleted, activity]

