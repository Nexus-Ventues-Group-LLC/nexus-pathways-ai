openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nexus Pathways AI Phase 1 foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Authenticated identity and portal context
  - name: administration
    description: Scoped organization administration
  - name: audit
    description: Security audit events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated user's portal context
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user and scoped organization context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [identity]
      summary: Get the authenticated user's Phase 1 dashboard summary
      security:
        - clerkSession: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get scoped administrator overview
      security:
        - clerkSession: []
      responses:
        "200":
          description: Scoped organization hierarchy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List security events visible to an authorized administrator
      security:
        - clerkSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session cookie in browser or bearer token for API clients
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not authorized for this scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScopeRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: "#/components/schemas/ScopeContext"
      required: [id, displayName, email, role, permissions, scope]
    ScopeContext:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/ScopeRef"
        agency:
          $ref: "#/components/schemas/ScopeRef"
        region:
          $ref: "#/components/schemas/ScopeRef"
        facility:
          $ref: "#/components/schemas/ScopeRef"
        program:
          $ref: "#/components/schemas/ScopeRef"
        cohort:
          $ref: "#/components/schemas/ScopeRef"
      required: [organization, agency, region, facility, program, cohort]
    Dashboard:
      type: object
      properties:
        portal:
          type: string
          enum: [learner, educator, administrator]
        headline:
          type: string
        scope:
          $ref: "#/components/schemas/ScopeContext"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        capabilities:
          type: array
          items:
            type: string
      required: [portal, headline, scope, metrics, capabilities]
    Metric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
      required: [label, value, detail]
    AdminOverview:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/ScopeRef"
        agencies:
          type: number
        regions:
          type: number
        facilities:
          type: number
        programs:
          type: number
        cohorts:
          type: number
        learners:
          type: number
        educators:
          type: number
        syntheticDataNotice:
          type: string
      required:
        [organization, agencies, regions, facilities, programs, cohorts, learners, educators, syntheticDataNotice]
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        category:
          type: string
        actorDisplayName:
          type: string
        resourceType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        outcome:
          type: string
      required: [id, action, category, actorDisplayName, resourceType, createdAt, outcome]

